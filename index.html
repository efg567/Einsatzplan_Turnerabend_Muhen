<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnerabend – Einsatzplan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EC;
  --panel:#FFFFFF;
  --ink:#1E271F;
  --muted:#767F70;
  --border:#E1DCC9;
  --primary:#1F3D2B;
  --primary-light:#2F5A3E;
  --primary-lighter:#EAF0E8;
  --accent:#C79A3B;
  --accent-light:#F6EBD0;
  --warn:#B4472F;
  --warn-light:#F7E3DD;
  --ok:#2F5A3E;
  --radius:10px;
  --shadow:0 1px 2px rgba(30,39,31,0.06), 0 4px 14px rgba(30,39,31,0.05);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;}
h1,h2,h3,h4{font-family:'Oswald',system-ui,sans-serif;font-weight:600;letter-spacing:0.01em;margin:0 0 8px;color:var(--primary);}
h1{font-size:22px;color:#fff;}
h2{font-size:18px;}
h3{font-size:15px;text-transform:uppercase;letter-spacing:0.06em;color:var(--primary-light);font-size:12.5px;}
a{color:var(--primary);}
header.top{background:var(--primary);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
header.top .sub{color:var(--accent-light);font-size:12.5px;opacity:0.85;margin-top:2px;}
header.top .right{display:flex;align-items:center;gap:14px;font-size:13px;}
.admin-toggle{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);padding:6px 10px;border-radius:20px;cursor:pointer;user-select:none;}
.admin-toggle.on{background:var(--accent);color:var(--primary);font-weight:600;}
nav.tabs{display:flex;gap:2px;background:var(--primary-light);padding:0 22px;overflow-x:auto;}
nav.tabs button{background:transparent;border:none;color:#dfe8dd;padding:12px 16px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.03em;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:#fff;border-bottom-color:var(--accent);}
main{max-width:1180px;margin:0 auto;padding:20px 22px 60px;}
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.panel + .panel{margin-top:16px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.row.between{justify-content:space-between;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;}
tr:hover td{background:#FAFAF3;}
input,select,textarea{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);}
textarea{font-family:ui-monospace,monospace;resize:vertical;}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
button{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:7px 12px;border-radius:6px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;}
button.secondary{background:#fff;color:var(--primary);}
button.ghost{background:transparent;color:var(--primary);border-color:var(--border);}
button.danger{background:#fff;color:var(--warn);border-color:var(--warn);}
button:disabled{opacity:0.45;cursor:not-allowed;}
button:hover:not(:disabled){filter:brightness(1.08);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;color:#fff;}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;}
.badge.ok{background:var(--primary-lighter);color:var(--ok);}
.badge.warn{background:var(--warn-light);color:var(--warn);}
.badge.muted{background:#EFEDE3;color:var(--muted);}
.small{font-size:12px;color:var(--muted);}
.day-chip{display:flex;flex-direction:column;align-items:center;background:var(--primary);color:#fff;border-radius:8px;padding:8px 14px;min-width:76px;text-align:center;}
.day-chip .d{font-family:'Oswald',sans-serif;font-size:18px;}
.day-chip .m{font-size:10.5px;opacity:0.8;text-transform:uppercase;}
.timeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
.timeline .tl-item{cursor:pointer;opacity:0.55;}
.timeline .tl-item.active{opacity:1;}
.taetigkeit-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#FEFDF9;}
.taetigkeit-card .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;}
.taetigkeit-card .head .name{font-weight:700;font-size:14.5px;}
.taetigkeit-card .head .time{font-family:'Oswald',sans-serif;color:var(--primary);font-size:14px;}
.verein-block{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);}
.verein-block .vtitle{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px;}
.slot-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:13px;}
.slot-row .name{flex:1;}
.slot-row.fixed .name{color:var(--primary);font-weight:600;}
.slot-row.empty .name{color:var(--muted);font-style:italic;}
.progress{height:6px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:4px;}
.progress > div{height:100%;background:var(--ok);}
.progress.warn > div{background:var(--warn);}
.form-inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end;margin-top:8px;}
.form-inline label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
.close-x{background:transparent;border:none;color:var(--warn);font-size:15px;padding:2px 6px;cursor:pointer;}
.empty-state{text-align:center;color:var(--muted);padding:30px 10px;}
.note{background:var(--accent-light);border:1px solid #E8D6A4;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#6B5420;margin-bottom:14px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
canvas{max-width:100%;}
.legend-swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;}
::-webkit-scrollbar{height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Turnerabend – Einsatzplan</h1>
    <div class="sub" id="headerSub">Wird geladen …</div>
  </div>
  <div class="right">
    <button id="pwChangeBtn" style="display:none;background:transparent;color:#fff;border-color:rgba(255,255,255,0.45);" onclick="changeAdminPassword()">Passwort ändern</button>
    <div class="admin-toggle" id="adminToggle" onclick="toggleAdmin()">🔧 Admin-Modus</div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="stamm" onclick="setTab('stamm')">Vereine &amp; Mitglieder</button>
  <button data-tab="taetig" onclick="setTab('taetig')">Termine &amp; Tätigkeiten</button>
  <button data-tab="plan" onclick="setTab('plan')">Einsatzplan</button>
  <button data-tab="auswertung" onclick="setTab('auswertung')">Auswertung</button>
</nav>
<div class="row between" id="statusBar" style="display:none;background:var(--primary-lighter);padding:6px 22px;font-size:12px;color:var(--primary-light);">
  <span id="statusText"></span>
</div>

<main id="main">
  <div class="empty-state">Lade Daten …</div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================= STORAGE / STATE ============================= */
const K_ME = 'turnerabend_mein_mitglied_id';

let STAMM = null, EINSAETZE = [], ADMIN = false, MEIN_ID = null, TAB = 'stamm';
let ACTIVE_TERMIN = null;
let CHARTS = {};
let db = null, dataDocRef = null, CONNECTED = false, FIREBASE_ERROR = null;

/* ---- HIER die eigene Firebase-Konfiguration einfügen (siehe Anleitung) ---- */
const firebaseConfig = {
  apiKey: "AIzaSyBHkB2sYE5ZHE5fLcUQAeEYzb6WU1lHOwU",
  authDomain: "turnerabend-2026.firebaseapp.com",
  projectId: "turnerabend-2026",
  storageBucket: "turnerabend-2026.firebasestorage.app",
  messagingSenderId: "782962540579",
  appId: "1:782962540579:web:19fe1c7d05abb2fa90f196"
};
const FIREBASE_CONFIGURED = !String(firebaseConfig.apiKey).startsWith('HIER_');

const PALETTE = ['#2F5A3E','#B4472F','#3A6EA5','#C79A3B','#7A4B8C','#3A8C8C','#A85C32','#5B6B8C'];

function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function toMin(hm){ if(!hm) return 0; const [h,m]=hm.split(':').map(Number); return h*60+(m||0); }
function fmtH(min){ const h=Math.floor(min/60), m=min%60; return m? (h+'h '+m+'min') : (h+'h'); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function defaultStamm(){
  const v1={id:'v_tv',name:'TV',color:PALETTE[0]}, v2={id:'v_gg',name:'GG',color:PALETTE[1]}, v3={id:'v_ftv',name:'FTV/MR',color:PALETTE[2]};
  return {
    vereine:[v1,v2,v3],
    mitglieder:[],
    bereiche:[
      {id:uid('ber'),name:'Eingang',verantwortlichId:null},
      {id:uid('ber'),name:'Bühne',verantwortlichId:null},
      {id:uid('ber'),name:'Halle',verantwortlichId:null},
      {id:uid('ber'),name:'Bar',verantwortlichId:null}
    ],
    termine:[
      {id:uid('ter'),name:'Vorprobe',datum:'2026-11-10'},
      {id:uid('ter'),name:'Hauptprobe / Aufstellen',datum:'2026-11-12'},
      {id:uid('ter'),name:'Showabend 1',datum:'2026-11-13'},
      {id:uid('ter'),name:'Showabend 2',datum:'2026-11-14'},
      {id:uid('ter'),name:'Aufräumen',datum:'2026-11-15'}
    ],
    taetigkeiten:[]
  };
}

/* ============================= FIREBASE-ANBINDUNG ============================= */
function loadMe(){ try{ const v = localStorage.getItem(K_ME); MEIN_ID = v ? JSON.parse(v) : null; }catch(e){ MEIN_ID = null; } }
function saveMe(){ try{ localStorage.setItem(K_ME, JSON.stringify(MEIN_ID)); }catch(e){} }

function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    dataDocRef = db.collection('turnerabend').doc('daten');
    dataDocRef.onSnapshot(
      snap=>{
        if(snap.exists){
          const data = snap.data();
          STAMM = data.stammdaten || defaultStamm();
          EINSAETZE = data.einsaetze || [];
        } else {
          STAMM = defaultStamm(); EINSAETZE = [];
        }
        CONNECTED = true; FIREBASE_ERROR = null;
        render();
      },
      err=>{ CONNECTED = false; FIREBASE_ERROR = err.message; render(); }
    );
  }catch(e){ FIREBASE_ERROR = e.message; render(); }
}
async function writeDataFile(){
  if(!dataDocRef){ toast('Keine Verbindung zur Datenablage'); return; }
  try{
    await dataDocRef.set({stammdaten:STAMM, einsaetze:EINSAETZE, zuletztGespeichert:new Date().toISOString()});
    const st = document.getElementById('statusText'); if(st) st.textContent = '🟢 Live verbunden · gespeichert '+new Date().toLocaleTimeString('de-CH');
  }catch(e){ toast('Speichern fehlgeschlagen: '+e.message); }
}
// Kompatibilitäts-Aliasse: bestehender Code ruft weiterhin saveStamm()/saveSlots() auf
async function saveStamm(){ await writeDataFile(); }
async function saveSlots(){ await writeDataFile(); }

/* ============================= SLOT SYNC LOGIC ============================= */
function syncSlotsForTaetigkeit(t){
  const vereinIds = new Set([...Object.keys(t.bedarf||{}).filter(k=>(t.bedarf[k]||0)>0), ...(t.fixe||[]).map(f=>f.vereinId)]);
  vereinIds.forEach(vId=>{
    const bedarf = (t.bedarf && t.bedarf[vId]) || 0;
    const fixe = (t.fixe||[]).filter(f=>f.vereinId===vId);
    fixe.forEach(f=>{
      const exists = EINSAETZE.find(s=>s.taetigkeitId===t.id && s.vereinId===vId && s.fixed && s.mitgliedId===f.mitgliedId);
      if(!exists) EINSAETZE.push({id:uid('slot'), taetigkeitId:t.id, vereinId:vId, mitgliedId:f.mitgliedId, fixed:true});
    });
    EINSAETZE = EINSAETZE.filter(s=> !(s.taetigkeitId===t.id && s.vereinId===vId && s.fixed && !fixe.some(f=>f.mitgliedId===s.mitgliedId)));
    const openNeeded = Math.max(0, bedarf - fixe.length);
    let openSlots = EINSAETZE.filter(s=>s.taetigkeitId===t.id && s.vereinId===vId && !s.fixed);
    if(openSlots.length < openNeeded){
      for(let i=openSlots.length;i<openNeeded;i++) EINSAETZE.push({id:uid('slot'), taetigkeitId:t.id, vereinId:vId, mitgliedId:null, fixed:false});
    } else if(openSlots.length > openNeeded){
      let toRemove = openSlots.length - openNeeded;
      const empties = openSlots.filter(s=>!s.mitgliedId);
      const removeIds = empties.slice(0, toRemove).map(s=>s.id);
      EINSAETZE = EINSAETZE.filter(s=>!removeIds.includes(s.id));
      // wenn immer noch zu viele (mehr besetzte als benötigt), bleiben diese bestehen -> werden als "überbesetzt" markiert
    }
  });
  EINSAETZE = EINSAETZE.filter(s=> s.taetigkeitId!==t.id || vereinIds.has(s.vereinId));
}
function syncAllSlots(){
  STAMM.taetigkeiten.forEach(syncSlotsForTaetigkeit);
  const validT = new Set(STAMM.taetigkeiten.map(t=>t.id));
  EINSAETZE = EINSAETZE.filter(s=>validT.has(s.taetigkeitId));
}
async function applyStammChange(){ syncAllSlots(); await saveStamm(); await saveSlots(); render(); }

/* ============================= LOOKUPS ============================= */
function verein(id){ return STAMM.vereine.find(v=>v.id===id); }
function mitglied(id){ return STAMM.mitglieder.find(m=>m.id===id); }
function bereich(id){ return STAMM.bereiche.find(b=>b.id===id); }
function termin(id){ return STAMM.termine.find(t=>t.id===id); }
function taetigkeit(id){ return STAMM.taetigkeiten.find(t=>t.id===id); }
function vereinColor(id){ const v=verein(id); return v? v.color : '#999'; }
function sortedTermine(){ return [...STAMM.termine].sort((a,b)=> a.datum.localeCompare(b.datum)); }
function taetigkeitenFor(terminId){ return STAMM.taetigkeiten.filter(t=>t.terminId===terminId).sort((a,b)=> toMin(a.von)-toMin(b.von)); }
function slotsFor(tId, vId){ return EINSAETZE.filter(s=>s.taetigkeitId===tId && (vId===undefined || s.vereinId===vId)); }

function hasConflict(mitgliedId, taet, excludeSlotId){
  const dag = termin(taet.terminId)?.datum;
  const meine = EINSAETZE.filter(s=>s.mitgliedId===mitgliedId && s.id!==excludeSlotId);
  for(const s of meine){
    const t2 = taetigkeit(s.taetigkeitId);
    if(!t2 || t2.id===taet.id) continue;
    const dag2 = termin(t2.terminId)?.datum;
    if(dag2!==dag) continue;
    if(toMin(taet.von) < toMin(t2.bis) && toMin(t2.von) < toMin(taet.bis)) return t2;
  }
  return null;
}

/* ============================= GEMEINSAMER ZUGANGSCODE (Website-weit) ============================= */
const K_ZUGANG = 'turnerabend_zugang_hash';
let ACCESS_OK = false;

function checkStoredAccess(){
  if(!STAMM.zugangscodeHash){ ACCESS_OK = true; return; } // noch kein Code gesetzt -> offen zugänglich
  try{ ACCESS_OK = localStorage.getItem(K_ZUGANG) === STAMM.zugangscodeHash; }
  catch(e){ ACCESS_OK = false; }
}
async function submitAccessCode(){
  const input = document.getElementById('accessCodeInput');
  const code = input ? input.value : '';
  if(!code){ toast('Bitte Zugangscode eingeben'); return; }
  const hash = await sha256(code);
  if(hash===STAMM.zugangscodeHash){
    ACCESS_OK = true;
    try{ localStorage.setItem(K_ZUGANG, hash); }catch(e){}
    render();
  } else {
    toast('Falscher Zugangscode');
  }
}
async function setZugangscode(){
  if(STAMM.zugangscodeHash){
    const old = prompt('Aktuellen Zugangscode zur Bestätigung eingeben:');
    if(old===null) return;
    const oldHash = await sha256(old);
    if(oldHash!==STAMM.zugangscodeHash){ toast('Aktueller Zugangscode stimmt nicht'); return; }
  }
  const p1 = prompt('Neuen gemeinsamen Zugangscode festlegen:');
  if(!p1) return;
  const p2 = prompt('Zugangscode bestätigen:');
  if(p1!==p2){ toast('Codes stimmen nicht überein'); return; }
  STAMM.zugangscodeHash = await sha256(p1);
  await saveStamm();
  try{ localStorage.setItem(K_ZUGANG, STAMM.zugangscodeHash); }catch(e){}
  toast('Zugangscode gespeichert. Bitte an alle Mitglieder weitergeben.');
  render();
}
async function removeZugangscode(){
  if(!STAMM.zugangscodeHash) return;
  const old = prompt('Aktuellen Zugangscode zur Bestätigung eingeben:');
  if(old===null) return;
  const oldHash = await sha256(old);
  if(oldHash!==STAMM.zugangscodeHash){ toast('Zugangscode stimmt nicht'); return; }
  if(!confirm('Zugangscode wirklich entfernen? Die Seite ist danach für jeden mit dem Link ohne Code zugänglich.')) return;
  delete STAMM.zugangscodeHash;
  await saveStamm();
  toast('Zugangscode entfernt');
  render();
}
function renderAccessGate(){
  return `<div class="panel" style="max-width:420px;margin:70px auto;text-align:center;">
    <h2>Zugangscode erforderlich</h2>
    <p class="small">Diese Seite ist nur mit dem gemeinsamen Zugangscode zugänglich. Frag deinen Verein bzw. die Organisation, falls du ihn nicht hast.</p>
    <input type="password" id="accessCodeInput" placeholder="Zugangscode" style="width:100%;text-align:center;margin:10px 0;" autofocus onkeydown="if(event.key==='Enter') submitAccessCode()">
    <button onclick="submitAccessCode()" style="width:100%;">Bestätigen</button>
  </div>`;
}

/* ============================= ADMIN-PASSWORTSCHUTZ ============================= */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function toggleAdmin(){
  if(ADMIN){ ADMIN=false; render(); return; }
  if(!STAMM.adminPasswordHash){
    const p1 = prompt('Es ist noch kein Admin-Passwort gesetzt.\nNeues Passwort festlegen:');
    if(!p1) return;
    const p2 = prompt('Passwort bestätigen:');
    if(p1!==p2){ toast('Passwörter stimmen nicht überein'); return; }
    STAMM.adminPasswordHash = await sha256(p1);
    await saveStamm();
    ADMIN = true; toast('Admin-Passwort gesetzt – merk es dir gut!'); render(); return;
  }
  const pw = prompt('Admin-Passwort eingeben:');
  if(pw===null) return;
  const hash = await sha256(pw);
  if(hash===STAMM.adminPasswordHash){ ADMIN=true; render(); }
  else toast('Falsches Passwort');
}
async function changeAdminPassword(){
  const old = prompt('Aktuelles Passwort:');
  if(old===null) return;
  const oldHash = await sha256(old);
  if(oldHash!==STAMM.adminPasswordHash){ toast('Aktuelles Passwort falsch'); return; }
  const p1 = prompt('Neues Passwort:');
  if(!p1) return;
  const p2 = prompt('Neues Passwort bestätigen:');
  if(p1!==p2){ toast('Passwörter stimmen nicht überein'); return; }
  STAMM.adminPasswordHash = await sha256(p1);
  await saveStamm();
  toast('Passwort geändert');
}

/* ============================= RENDER SHELL ============================= */
function setTab(t){ TAB=t; render(); }

function render(){
  const nav = document.getElementById('tabs');
  const statusBar = document.getElementById('statusBar');
  const main = document.getElementById('main');

  if(!FIREBASE_CONFIGURED){
    nav.style.display='none'; statusBar.style.display='none';
    document.getElementById('headerSub').textContent = 'Noch nicht eingerichtet';
    main.innerHTML = renderSetupGate();
    return;
  }
  if(!CONNECTED){
    nav.style.display='none'; statusBar.style.display='none';
    document.getElementById('headerSub').textContent = FIREBASE_ERROR ? 'Verbindung fehlgeschlagen' : 'Verbinde …';
    main.innerHTML = renderConnectingGate();
    return;
  }
  nav.style.display='flex'; statusBar.style.display='flex';
  document.getElementById('statusText').textContent = '🟢 Live verbunden — Änderungen werden sofort für alle gespeichert';

  checkStoredAccess();
  if(!ACCESS_OK){
    nav.style.display='none'; statusBar.style.display='none';

function handleImportFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ const ta=document.getElementById('importText'); if(ta) ta.value = reader.result; };
  reader.readAsText(file, 'UTF-8');
}
function importMitglieder(){
  const ta = document.getElementById('importText'); const raw = ta ? ta.value : '';
  const defaultVereinId = document.getElementById('importVerein').value;
  const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let added=0, skipped=0, unknownVerein=0;
  lines.forEach(line=>{
    const parts = line.split(/[,;\t]/).map(p=>p.trim()).filter(Boolean);
    if(!parts.length) return;
    const name = parts[0];
    if(!name || /^name$/i.test(name)) return; // Kopfzeile überspringen
    let vereinId = defaultVereinId;
    if(parts[1]){
      const match = STAMM.vereine.find(v=>v.name.toLowerCase()===parts[1].toLowerCase());
      if(match) vereinId = match.id; else unknownVerein++;
    }
    const exists = STAMM.mitglieder.some(m=>m.name.toLowerCase()===name.toLowerCase() && m.vereinId===vereinId);
    if(exists){ skipped++; return; }
    STAMM.mitglieder.push({id:uid('m'), name, vereinId});
    added++;
  });
  toast(`${added} hinzugefügt, ${skipped} übersprungen${unknownVerein? ', '+unknownVerein+' mit unbekanntem Verein (Standard verwendet)':''}`);
  applyStammChange();
}
function exportBackupJSON(){
  const data = {stammdaten:STAMM, einsaetze:EINSAETZE, exportiertAm:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download = `turnerabend-backup-${new Date().toISOString().slice(0,10)}.json`;
  link.click();
}
function handleRestoreFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.stammdaten || !data.einsaetze){ toast('Ungültige Backup-Datei'); return; }
      if(!confirm('Aktuelle Daten werden durch die Backup-Datei ersetzt. Fortfahren?')) return;
      STAMM = data.stammdaten; EINSAETZE = data.einsaetze;
      await saveStamm(); await saveSlots();
      toast('Backup wiederhergestellt'); render();
    }catch(e){ toast('Datei konnte nicht gelesen werden'); }
  };
  reader.readAsText(file, 'UTF-8');
}

function fmtDatum(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('de-CH',{weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'}); }

function renderTaetigkeitAdminCard(tk){
  const ber = bereich(tk.bereichId);
  let html = `<div class="taetigkeit-card">
    <div class="head">
      <span class="name">${esc(tk.name)} <span class="small">— ${esc(ber?.name||'?')}${ber?.verantwortlichId? ' (Verantw.: '+esc(mitglied(ber.verantwortlichId)?.name||'')+')':''}</span></span>
      <span class="time">${tk.von}–${tk.bis} Uhr</span>
    </div>`;
  STAMM.vereine.forEach(v=>{
    const bedarf = (tk.bedarf && tk.bedarf[v.id]) || 0;
    if(bedarf<=0 && !(tk.fixe||[]).some(f=>f.vereinId===v.id)) return;
    const slots = slotsFor(tk.id, v.id);
    const besetzt = slots.filter(s=>s.mitgliedId).length;
    const over = besetzt > bedarf;
    html += `<div class="verein-block"><div class="vtitle" style="color:${v.color}">${esc(v.name)} — ${besetzt}/${bedarf} besetzt ${over?'<span class="badge warn">überbesetzt</span>':''}</div>`;
    slots.forEach(s=>{
      const m = mitglied(s.mitgliedId);
      html += `<div class="slot-row ${s.fixed?'fixed':''} ${!s.mitgliedId?'empty':''}"><span class="name">${m? esc(m.name):'— frei —'} ${s.fixed?'<span class="badge ok">fix</span>':''}</span>`;

  html += `</div>`;
  return html;
}
function adminClearSlot(slotId){ const s=EINSAETZE.find(x=>x.id===slotId); if(!s) return; if(s.fixed){ toast('Fixe Zuteilung – bitte in der Tätigkeit anpassen'); return; } s.mitgliedId=null; saveSlots(); render(); }

  return `<div class="taetigkeit-card" style="border-style:dashed;">

      <div><label>Bereich</label><select id="nt_bereich_${terminId}">${STAMM.bereiche.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div>

  if(!confirm('Termin wirklich löschen?')) return; STAMM.termine=STAMM.termine.filter(t=>t.id!==id); applyStammChange(); }

function addTaetigkeit(terminId){
  const bereichId = document.getElementById('nt_bereich_'+terminId).value;
  const name = document.getElementById('nt_name_'+terminId).value.trim();
  const von = document.getElementById('nt_von_'+terminId).value;
  const bis = document.getElementById('nt_bis_'+terminId).value;
  if(!name||!von||!bis){ toast('Bitte Tätigkeit, Von und Bis ausfüllen'); return; }
  if(toMin(bis)<=toMin(von)){ toast('Ende muss nach Beginn liegen'); return; }
  const bedarf = {};
  STAMM.vereine.forEach(v=>{ const val = parseInt(document.getElementById('nt_bedarf_'+terminId+'_'+v.id).value)||0; if(val>0) bedarf[v.id]=val; });
  STAMM.taetigkeiten.push({id:uid('tk'), terminId, bereichId, name, von, bis, bedarf, fixe:[]});
  applyStammChange();
}
function delTaetigkeit(id){ if(!confirm('Tätigkeit wirklich löschen? Alle zugehörigen Einsätze werden entfernt.')) return;
  STAMM.taetigkeiten = STAMM.taetigkeiten.filter(t=>t.id!==id); applyStammChange(); }

function editTaetigkeit(id){
  const tk = taetigkeit(id); if(!tk) return;
  const name = prompt('Bezeichnung der Tätigkeit:', tk.name); if(name===null) return;
  const von = prompt('Beginn (HH:MM):', tk.von); if(von===null) return;
  const bis = prompt('Ende (HH:MM):', tk.bis); if(bis===null) return;
  if(toMin(bis)<=toMin(von)){ toast('Ende muss nach Beginn liegen'); return; }
  tk.name = name.trim()||tk.name; tk.von=von; tk.bis=bis;
  STAMM.vereine.forEach(v=>{
    const cur = (tk.bedarf&&tk.bedarf[v.id])||0;
    const val = prompt('Benötigte Anzahl '+v.name+':', cur);
    if(val!==null){ const n=parseInt(val)||0; if(!tk.bedarf) tk.bedarf={}; if(n>0) tk.bedarf[v.id]=n; else delete tk.bedarf[v.id]; }
  });
  if(confirm('Fixe Personen für diese Tätigkeit festlegen/ändern?')){
    editFixePersonen(tk);
  }
  applyStammChange();
}
function editFixePersonen(tk){
  STAMM.vereine.forEach(v=>{
    if(!((tk.bedarf&&tk.bedarf[v.id])>0)) return;
    const eligibleNames = STAMM.mitglieder.filter(m=>m.vereinId===v.id).map(m=>m.name).join(', ');
    const currentNames = (tk.fixe||[]).filter(f=>f.vereinId===v.id).map(f=>mitglied(f.mitgliedId)?.name).filter(Boolean).join(', ');
    const input = prompt('Fixe Personen für '+v.name+' (kommagetrennt, verfügbar: '+eligibleNames+')', currentNames);
    if(input===null) return;
    const names = input.split(',').map(s=>s.trim()).filter(Boolean);
    const ids = names.map(n=> STAMM.mitglieder.find(m=>m.vereinId===v.id && m.name.toLowerCase()===n.toLowerCase())?.id).filter(Boolean);
    tk.fixe = (tk.fixe||[]).filter(f=>f.vereinId!==v.id);
    ids.forEach(mid=> tk.fixe.push({vereinId:v.id, mitgliedId:mid}));
  });
}

        <select onchange="setMe(this.value)">
          <option value="">– auswählen –</option>
          ${[...STAMM.mitglieder].sort((a,b)=>a.name.localeCompare(b.name)).map(m=>`<option value="${m.id}" ${m.id===MEIN_ID?'selected':''}>${esc(m.name)} (${esc(verein(m.vereinId)?.name||'')})</option>`).join('')}
        </select>
      </div>
      <label class="small"><input type="checkbox" id="nurMeine" onchange="render()"> Nur meine Einsätze anzeigen</label>
    </div>
  </div>`;

  html += `<div class="timeline">`;
  days.forEach(t=>{
    html += `<div class="tl-item ${t.id===ACTIVE_TERMIN?'active':''}" onclick="selectTermin('${t.id}')">
      <div class="day-chip"><div class="d">${new Date(t.datum+'T00:00:00').getDate()}.${new Date(t.datum+'T00:00:00').getMonth()+1}.</div><div class="m">${esc(t.name)}</div></div>
    </div>`;
  });
  html += `</div>`;

  const tk = ACTIVE_TERMIN ? taetigkeitenFor(ACTIVE_TERMIN) : [];
  const nurMeine = document.getElementById('nurMeine')?.checked;
  html += `<div class="panel">`;
  if(!tk.length) html += `<div class="empty-state">Für diesen Termin sind noch keine Tätigkeiten erfasst.</div>`;
  tk.forEach(t=>{
    const meineSlots = EINSAETZE.filter(s=>s.taetigkeitId===t.id && s.mitgliedId===MEIN_ID);
    if(nurMeine && !meineSlots.length) return;
    html += renderTaetigkeitPlanCard(t);
  });
  html += `</div>`;
  return html;
}
function selectTermin(id){ ACTIVE_TERMIN=id; render(); }
function setMe(id){ MEIN_ID = id||null; saveMe(); render(); }

function renderTaetigkeitPlanCard(t){
  const ber = bereich(t.bereichId);
  let html = `<div class="taetigkeit-card">
    <div class="head">
      <span class="name">${esc(t.name)} <span class="small">— ${esc(ber?.name||'?')}${ber?.verantwortlichId?' · Verantw.: '+esc(mitglied(ber.verantwortlichId)?.name||''):''}</span></span>
      <span class="time">${t.von}–${t.bis} Uhr</span>
    </div>`;
  STAMM.vereine.forEach(v=>{
    const bedarf = (t.bedarf&&t.bedarf[v.id])||0;
    const hasFix = (t.fixe||[]).some(f=>f.vereinId===v.id);
    if(bedarf<=0 && !hasFix) return;
    const slots = slotsFor(t.id, v.id);
    const besetzt = slots.filter(s=>s.mitgliedId).length;
    const pct = bedarf>0? Math.min(100,(besetzt/bedarf)*100) : 100;
    html += `<div class="verein-block"><div class="vtitle" style="color:${v.color}">${esc(v.name)} — ${besetzt}/${bedarf}</div>
      <div class="progress ${besetzt<bedarf?'warn':''}"><div style="width:${pct}%"></div></div>`;
    slots.forEach(s=>{
      const m = mitglied(s.mitgliedId);
      html += `<div class="slot-row ${s.fixed?'fixed':''} ${!s.mitgliedId?'empty':''}"><span class="name">${m? esc(m.name):'— frei —'} ${s.fixed?'<span class="badge ok">fix</span>':''}</span>`;
      if(s.fixed){
        // fix, keine Aktion
      } else if(s.mitgliedId){
        if(ADMIN || s.mitgliedId===MEIN_ID) html += `<button class="ghost" onclick="releaseSlot('${s.id}')">Austragen</button>`;
      } else {
        if(ADMIN){
          html += `<button class="secondary" onclick="adminAssignPrompt('${s.id}','${v.id}')">Zuweisen</button>`;
        } else if(MEIN_ID && mitglied(MEIN_ID)?.vereinId===v.id){
          html += `<button onclick="claimSlot('${s.id}')">Eintragen</button>`;
        } else {
          html += `<span class="small">${MEIN_ID? 'anderer Verein':'wähle dich oben aus'}</span>`;
        }
      }
      html += `</div>`;
    });
    html += `</div>`;
  });
  return html;
}
async function claimSlot(slotId){
  if(!MEIN_ID){ toast('Bitte zuerst dich selbst auswählen'); return; }
  const s = EINSAETZE.find(x=>x.id===slotId); if(!s||s.mitgliedId) return;
  const t = taetigkeit(s.taetigkeitId);
  const conflict = hasConflict(MEIN_ID, t, s.id);
  if(conflict){ toast('Zeitkonflikt mit "'+conflict.name+'" ('+conflict.von+'–'+conflict.bis+') – nicht möglich'); return; }
  s.mitgliedId = MEIN_ID;
  await saveSlots(); render(); toast('Eingetragen: '+t.name);
}
async function releaseSlot(slotId){
  const s = EINSAETZE.find(x=>x.id===slotId); if(!s) return;
  s.mitgliedId = null; await saveSlots(); render(); toast('Ausgetragen');
}
async function adminAssignPrompt(slotId, vereinId){
  const options = STAMM.mitglieder.filter(m=>m.vereinId===vereinId);
  if(!options.length){ toast('Keine Mitglieder in diesem Verein erfasst'); return; }
  const name = prompt('Wen eintragen?\n'+options.map(m=>m.name).join(', '));
  if(!name) return;
  const m = options.find(m=>m.name.toLowerCase()===name.trim().toLowerCase());
  if(!m){ toast('Person nicht gefunden'); return; }
  const s = EINSAETZE.find(x=>x.id===slotId);
  const t = taetigkeit(s.taetigkeitId);
  const conflict = hasConflict(m.id, t, s.id);
  if(conflict && !confirm('Zeitkonflikt mit "'+conflict.name+'" — trotzdem eintragen?')) return;
  s.mitgliedId = m.id; await saveSlots(); render();
}

/* ============================= TAB 4: AUSWERTUNG ============================= */
function computeStats(){
  const perMember = {}; // id -> minutes
  const perVereinPerTermin = {}; // vereinId -> terminId -> minutes
  STAMM.mitglieder.forEach(m=> perMember[m.id]=0);
  EINSAETZE.filter(s=>s.mitgliedId).forEach(s=>{
    const t = taetigkeit(s.taetigkeitId); if(!t) return;
    const dur = toMin(t.bis)-toMin(t.von);
    perMember[s.mitgliedId] = (perMember[s.mitgliedId]||0) + dur;
    perVereinPerTermin[s.vereinId] = perVereinPerTermin[s.vereinId] || {};
    perVereinPerTermin[s.vereinId][t.terminId] = (perVereinPerTermin[s.vereinId][t.terminId]||0) + dur;
  });
  const perVereinAvg = {};
  STAMM.vereine.forEach(v=>{
    const members = STAMM.mitglieder.filter(m=>m.vereinId===v.id);
    const total = members.reduce((s,m)=>s+(perMember[m.id]||0),0);
    perVereinAvg[v.id] = members.length? total/members.length : 0;
  });
  let totalSlots=0, filledSlots=0;
  STAMM.taetigkeiten.forEach(t=>{ STAMM.vereine.forEach(v=>{ const b=(t.bedarf&&t.bedarf[v.id])||0; if(b>0){ totalSlots+=b; filledSlots+=Math.min(b, slotsFor(t.id,v.id).filter(s=>s.mitgliedId).length); } }); });
  return {perMember, perVereinPerTermin, perVereinAvg, totalSlots, filledSlots};
}

function renderAuswertung(){
  const stats = computeStats();
  let html = `<div class="grid cols-3">
    <div class="panel"><h3>Besetzungsgrad</h3><h2 style="font-size:26px;">${stats.totalSlots? Math.round(stats.filledSlots/stats.totalSlots*100):0}%</h2><div class="small">${stats.filledSlots} von ${stats.totalSlots} Plätzen besetzt</div></div>
    <div class="panel"><h3>Mitglieder</h3><h2 style="font-size:26px;">${STAMM.mitglieder.length}</h2><div class="small">über ${STAMM.vereine.length} Vereine</div></div>
    <div class="panel"><h3>Tätigkeiten</h3><h2 style="font-size:26px;">${STAMM.taetigkeiten.length}</h2><div class="small">über ${STAMM.termine.length} Termine</div></div>
  </div>`;

  html += `<div class="grid cols-2" style="margin-top:16px;">
    <div class="panel"><h2>Stunden pro Mitglied</h2><canvas id="chartMember" height="260"></canvas></div>
    <div class="panel"><h2>Stunden pro Verein &amp; Termin</h2><canvas id="chartVereinTermin" height="260"></canvas></div>
  </div>`;

  html += `<div class="panel" style="margin-top:16px;"><div class="row between"><h2>Controlling: Einsatzgerechtigkeit</h2><button class="secondary" onclick="exportCSV()">⬇ CSV exportieren</button></div>
    <div class="small" style="margin-bottom:8px;">Vergleich der individuellen Einsatzzeit mit dem Durchschnitt des eigenen Vereins.</div>
    <table><thead><tr><th>Mitglied</th><th>Verein</th><th>Stunden</th><th>Ø Verein</th><th>Abweichung</th></tr></thead><tbody>`;
  [...STAMM.mitglieder].sort((a,b)=> (stats.perMember[b.id]||0)-(stats.perMember[a.id]||0)).forEach(m=>{
    const min = stats.perMember[m.id]||0;
    const avg = stats.perVereinAvg[m.vereinId]||0;
    const diff = min-avg;
    const diffAbs = Math.abs(diff);
    const badge = diffAbs<=30? '<span class="badge ok">ausgeglichen</span>' : (diff>0? '<span class="badge warn">+ überdurchschnittlich</span>':'<span class="badge warn">− unterdurchschnittlich</span>');
    html += `<tr><td>${esc(m.name)}</td><td><span class="pill" style="background:${vereinColor(m.vereinId)}">${esc(verein(m.vereinId)?.name||'')}</span></td><td>${fmtH(min)}</td><td>${fmtH(Math.round(avg))}</td><td>${diff>=0?'+':''}${fmtH(diff)} ${badge}</td></tr>`;
  });
  if(!STAMM.mitglieder.length) html += `<tr><td colspan="5" class="small">Keine Mitglieder erfasst.</td></tr>`;
  html += `</tbody></table></div>`;

  html += `<div class="panel" style="margin-top:16px;"><h2>Offene Tätigkeiten</h2><table><thead><tr><th>Termin</th><th>Tätigkeit</th><th>Verein</th><th>Fehlend</th></tr></thead><tbody>`;
  let anyOpen=false;
  sortedTermine().forEach(te=> taetigkeitenFor(te.id).forEach(t=>{
    STAMM.vereine.forEach(v=>{
      const bedarf=(t.bedarf&&t.bedarf[v.id])||0; if(bedarf<=0) return;
      const besetzt = slotsFor(t.id,v.id).filter(s=>s.mitgliedId).length;
      if(besetzt<bedarf){ anyOpen=true; html += `<tr><td>${fmtDatum(te.datum)}</td><td>${esc(t.name)}</td><td><span class="pill" style="background:${v.color}">${esc(v.name)}</span></td><td>${bedarf-besetzt}</td></tr>`; }
    });
  }));
  if(!anyOpen) html += `<tr><td colspan="4" class="small">Alle Tätigkeiten sind vollständig besetzt. 🎉</td></tr>`;
  html += `</tbody></table></div>`;
  return html;
}

function drawCharts(){
  Object.values(CHARTS).forEach(c=>c.destroy());
  CHARTS = {};
  const stats = computeStats();
  const ctx1 = document.getElementById('chartMember');
  if(ctx1){
    const members = [...STAMM.mitglieder].sort((a,b)=>(stats.perMember[b.id]||0)-(stats.perMember[a.id]||0));
    CHARTS.member = new Chart(ctx1, { type:'bar', data:{
      labels: members.map(m=>m.name),
      datasets:[{ label:'Stunden', data: members.map(m=>+(((stats.perMember[m.id]||0))/60).toFixed(2)), backgroundColor: members.map(m=>vereinColor(m.vereinId)) }]
    }, options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{title:{display:true,text:'Stunden'}}} }});
  }
  const ctx2 = document.getElementById('chartVereinTermin');
  if(ctx2){
    const days = sortedTermine();
    CHARTS.vt = new Chart(ctx2, { type:'bar', data:{
      labels: days.map(d=>d.name),
      datasets: STAMM.vereine.map(v=>({ label:v.name, backgroundColor:v.color,
        data: days.map(d=> +(((stats.perVereinPerTermin[v.id]&&stats.perVereinPerTermin[v.id][d.id])||0)/60).toFixed(2)) }))
    }, options:{ scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true,text:'Stunden'}} } }});
  }
}

function exportCSV(){
  const stats = computeStats();
  let rows = [['Mitglied','Verein','Stunden']];
  STAMM.mitglieder.forEach(m=> rows.push([m.name, verein(m.vereinId)?.name||'', ((stats.perMember[m.id]||0)/60).toFixed(2)]));
  const csv = rows.map(r=> r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'einsatzplan_auswertung.csv';
  link.click();
}

/* ============================= INIT ============================= */
(function init(){
  loadMe();
  STAMM = defaultStamm(); EINSAETZE = [];
  if(FIREBASE_CONFIGURED){ initFirebase(); }
  render();
})();
</script>
